# OrderFlow, local stack.   cp .env.example .env   then   docker compose up --build
#
#   Frontend  http://localhost:3000
#   Gateway   http://localhost:8080   (all API calls go through here)
#   Auth      http://localhost:8081   (published only for the Google OAuth2 redirect)
#
# Every service reads its config from environment variables, the same way it does on
# Railway, so this file and the cloud deployment use the same settings.
# Eureka and Config Server are not used by the services (both are disabled in each
# application.yml), so they only start with:  docker compose --profile platform up

x-java-service: &java-service
  restart: unless-stopped
  networks: [orderflow]

x-healthcheck: &actuator-health
  test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/actuator/health | grep -q UP"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # local only, for debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orderflow]

  # KRaft mode: no Zookeeper needed
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "orderflow-kraft-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [orderflow]

  # ---------- Business services ----------
  auth-service:
    <<: *java-service
    build: ./auth-service
    environment: &common-env
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Spring refuses to start with an empty OAuth client id, so use a placeholder when Google is not configured.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      OAUTH2_REDIRECT_URI: http://localhost:8081/login/oauth2/code/google
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8081:8081"
    healthcheck: *actuator-health

  inventory-service:
    <<: *java-service
    build: ./inventory-service
    environment:
      PORT: "8082"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: *actuator-health

  payment-service:
    <<: *java-service
    build: ./payment-service
    environment:
      PORT: "8084"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck: *actuator-health

  order-service:
    <<: *java-service
    build: ./order-service
    environment:
      PORT: "8083"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    healthcheck: *actuator-health

  notification-service:
    <<: *java-service
    build: ./notification-service
    environment:
      PORT: "8085"
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck: *actuator-health

  api-gateway:
    <<: *java-service
    build: ./api-gateway
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      auth-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    ports:
      - "8080:8080"
    healthcheck: *actuator-health

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time and used by the BROWSER, so these must be
        # URLs the browser can reach (localhost ports), not Docker service names.
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_DIRECT_URL: http://localhost:8081
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: [orderflow]

  # ---------- Optional platform services (not used by the app at runtime) ----------
  config-server:
    profiles: ["platform"]
    build: ./config-server
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    networks: [orderflow]

  eureka-server:
    profiles: ["platform"]
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks: [orderflow]

volumes:
  postgres-data:

networks:
  orderflow:
