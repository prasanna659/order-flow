

services:
  # ---------- Infrastructure ----------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"   # host 3307 → container 3306 (avoids clash with local MySQL80 on Windows)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # KRaft mode -- no separate Zookeeper container needed
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "orderflow-kraft-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ---------- Platform ----------
  config-server:
    build: ./config-server
    container_name: config-server
    ports: ["8888:8888"]
    volumes:
      - ./config-repo:/config-repo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports: ["8761:8761"]
    depends_on:
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Business services ----------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      mysql: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8082:8082"]

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    ports: ["8084:8084"]

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      inventory-service: { condition: service_started }
      payment-service: { condition: service_started }
    ports: ["8083:8083"]

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8085:8085"]
    environment:
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      eureka-server: { condition: service_healthy }
      auth-service: { condition: service_started }
      order-service: { condition: service_started }
    ports: ["8080:8080"]

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      args:
        # These become VITE_* env vars baked into the JS bundle at build time.
        # The browser uses these at runtime, so they must be the URLs the
        # browser can reach — i.e. localhost ports, not Docker service names.
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_DIRECT_URL: http://localhost:8081
    container_name: frontend
    depends_on:
      - api-gateway
    ports: ["3000:80"]

volumes:
  mysql-data:
  postgres-data:
