server:
  port: ${PORT:8084}

spring:
  application:
    name: payment-service

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

  # ── Database ──────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paymentdb?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpass}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # ── Kafka ─────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── JWT (for validating tokens forwarded by gateway) ──────────────────
jwt:
  secret: ${JWT_SECRET:orderflow-super-secret-key-change-me-in-real-deployments-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── Stripe / Payment provider ─────────────────────────────────────────
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
