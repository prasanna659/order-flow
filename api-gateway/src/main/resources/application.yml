server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

    gateway:
      # Disable Eureka-based load balancing — use direct service URLs instead
      discovery:
        locator:
          enabled: false

      routes:
        # ── Public routes ───────────────────────────────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://authservice-b230.up.railway.app}
          predicates:
            - Path=/api/auth/**
          # No Auth filter — register/login can't require a token you don't have yet.

        # ── Google OAuth2 flow (public — browser-initiated redirect) ────
        # /oauth2/authorization/google  → auth-service initiates Google redirect
        # /login/oauth2/code/google     → Google redirects back here with auth code
        - id: oauth2-authorization
          uri: ${AUTH_SERVICE_URL:https://authservice-b230.up.railway.app}
          predicates:
            - Path=/oauth2/**

        - id: oauth2-callback
          uri: ${AUTH_SERVICE_URL:https://authservice-b230.up.railway.app}
          predicates:
            - Path=/login/oauth2/**

        - id: inventory-browse
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/products
            - Method=GET
          # Public — anyone can browse the catalog.

        # ── Protected routes ────────────────────────────────────────────
        - id: order-service
          uri: ${ORDER_SERVICE_URL:https://orderservice-374f.up.railway.app}
          predicates:
            - Path=/api/orders/**
          filters:
            - Auth

        - id: payment-transactions
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/transactions/**
          filters:
            - Auth

        # ── Health endpoints (public — used by frontend health page) ────
        - id: health-order
          uri: ${ORDER_SERVICE_URL:https://orderservice-374f.up.railway.app}
          predicates:
            - Path=/health/orders
          filters:
            - RewritePath=/health/orders, /actuator/health

        - id: health-auth
          uri: ${AUTH_SERVICE_URL:https://authservice-b230.up.railway.app}
          predicates:
            - Path=/health/auth
          filters:
            - RewritePath=/health/auth, /actuator/health

        - id: health-inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/health/inventory
          filters:
            - RewritePath=/health/inventory, /actuator/health

        - id: health-payment
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/health/payment
          filters:
            - RewritePath=/health/payment, /actuator/health

        - id: health-notification
          uri: ${NOTIFICATION_SERVICE_URL:https://notificationservice91dd.up.railway.app}
          predicates:
            - Path=/health/notification
          filters:
            - RewritePath=/health/notification, /actuator/health

        # ── Swagger / OpenAPI docs (public) ────────────────────────────
        - id: swagger-order
          uri: ${ORDER_SERVICE_URL:https://orderservice-374f.up.railway.app}
          predicates:
            - Path=/docs/orders/**
          filters:
            - RewritePath=/docs/orders/(?<segment>.*), /${segment}

        - id: swagger-auth
          uri: ${AUTH_SERVICE_URL:https://authservice-b230.up.railway.app}
          predicates:
            - Path=/docs/auth/**
          filters:
            - RewritePath=/docs/auth/(?<segment>.*), /${segment}

        - id: swagger-inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/inventory/**
          filters:
            - RewritePath=/docs/inventory/(?<segment>.*), /${segment}

        - id: swagger-payment
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/docs/payment/**
          filters:
            - RewritePath=/docs/payment/(?<segment>.*), /${segment}

        - id: swagger-notification
          uri: ${NOTIFICATION_SERVICE_URL:https://notificationservice91dd.up.railway.app}
          predicates:
            - Path=/docs/notification/**
          filters:
            - RewritePath=/docs/notification/(?<segment>.*), /${segment}

# ── JWT (gateway validates tokens before forwarding) ──────────────────
jwt:
  secret: ${JWT_SECRET:}

# ── App ───────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:https://order-flow-ten-kohl.vercel.app}

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
