spring:
  datasource:
    url: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true
    username: root
    password: rootpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # ── Kafka producer (for password-reset events → notification-service) ──
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Google OAuth2 ─────────────────────────────────────────────────────
  # OAuth2 flow goes DIRECTLY through auth-service (port 8081), NOT via gateway.
  # The reactive gateway cannot proxy stateful servlet OAuth2 redirects.
  #
  # Google Console → Authorized redirect URIs:
  #   http://localhost:8081/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "http://localhost:8081/login/oauth2/code/google"

# URL the success/failure handlers redirect to after OAuth2.
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
