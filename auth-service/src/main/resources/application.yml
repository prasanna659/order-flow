server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

  # ── Database ──────────────────────────────────────────────────────────
  # Priority order:
  #   1. SPRING_DATASOURCE_URL (set this in Railway Variables UI)
  #   2. DATABASE_URL (some Railway templates use this name)
  #   3. Falls back to localhost for local dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/authdb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # ── Kafka ─────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Google OAuth2 ─────────────────────────────────────────────────────
  # OAuth2 flow goes DIRECTLY through auth-service, NOT via gateway.
  # Google Console → Authorized redirect URIs must include:
  #   https://<auth-service-railway-domain>/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${OAUTH2_REDIRECT_URI:/login/oauth2/code/google}"

# ── JWT ───────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── App ───────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:https://order-flow-ten-kohl.vercel.app}

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
