server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

  # ── Database ──────────────────────────────────────────────────────────
  # Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
  # when a Postgres plugin is attached. SPRING_DATASOURCE_URL can also be set
  # directly as an override in Railway's Variables UI.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:authdb}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgrespass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Allow up to 30 s for Railway's Postgres to become reachable on cold start
      connection-timeout: 30000
      # -1 means "do not fail fast on startup" — lets Hikari retry until
      # connection-timeout is reached instead of aborting immediately
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Explicit dialect prevents Hibernate trying to read JDBC metadata
        # before a connection is available, which causes startup failures
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ── Kafka ─────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Google OAuth2 ─────────────────────────────────────────────────────
  # OAuth2 flow goes DIRECTLY through auth-service, NOT via gateway.
  # Google Console → Authorized redirect URIs must include:
  #   https://<auth-service-railway-domain>/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}"

# ── JWT ───────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:orderflow-super-secret-key-change-me-in-real-deployments-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── App ───────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
