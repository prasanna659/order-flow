server:
  port: ${PORT:8082}

spring:
  application:
    name: inventory-service

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

  # ── Database ──────────────────────────────────────────────────────────
  # Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
  # when a Postgres plugin is attached. SPRING_DATASOURCE_URL can also be set
  # directly as an override in Railway's Variables UI.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:inventorydb}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgrespass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  sql:
    init:
      mode: always

# ── JWT (for validating tokens forwarded by gateway) ──────────────────
jwt:
  secret: ${JWT_SECRET:orderflow-super-secret-key-change-me-in-real-deployments-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
