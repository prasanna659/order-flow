server:
  port: ${PORT:8083}

spring:
  application:
    name: order-service

  # Disable Config Server — config is injected via Railway environment variables
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

  # ── Database ──────────────────────────────────────────────────────────
  # Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
  # when a Postgres plugin is attached. SPRING_DATASOURCE_URL can also be set
  # directly as an override in Railway's Variables UI.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:orderdb}}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:rootpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ── Kafka ─────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── JWT (for validating tokens forwarded by gateway) ──────────────────
jwt:
  secret: ${JWT_SECRET:orderflow-super-secret-key-change-me-in-real-deployments-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── Inter-service URLs (replace lb:// with direct Railway URLs) ────────
services:
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

# ── Resilience4j circuit breakers ─────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      paymentService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# ── Eureka (disabled — not used on Railway) ───────────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
